[package]
name = "gpui-pre-macros"
version = "0.3.9"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Macros used by gpui"

[lints]
workspace = true

[features]
inspector = []

[lib]
name = "gpui_macros"
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
gpui = { workspace = true, features = ["inspector"] }
