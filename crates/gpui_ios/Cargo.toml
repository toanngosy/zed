[package]
name = "gpui_ios"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
autoexamples = false

# SPIKE (spike/gpui-ios-poc): minimal, reference-only-derived iOS GPUI backend
# for the GO/NO-GO PoC (issue #1325 de-risk). Written from scratch against the
# fork's `gpui_web`/`gpui_wgpu` (Apache-2.0), learning the HOW from the
# disjunctively-licensed `references/gpui-mobile` (we elect Apache-2.0). NOT the
# production backend — only what the two PoC questions (run-loop + shared_wgpu
# chart embed) need. See plans/260715-gpui-ios-poc.

[lints]
workspace = true

[lib]
path = "src/gpui_ios.rs"

# `gpui` is NOT iOS-gated: the platform seam's portable half (`text_seam`, the
# text-input handler storage + forwarding) compiles and unit-tests on the host
# so the headless `#[gpui::test]` can run off-device. The heavy iOS-only deps
# (`gpui_wgpu`, `wgpu`, `dispatch2`, …) stay gated below.
[dependencies]
gpui.workspace = true

[dev-dependencies]
# `test-support` unlocks `TestAppContext` + `#[gpui::test]` for `text_seam`'s
# headless end-to-end test.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "ios")'.dependencies]
gpui_wgpu.workspace = true
# Lux fork (additive): name `wgpu::Device`/`Queue`/`Adapter`/`Instance` for the
# Metal surface + the shared_wgpu accessor (chart-engine zero-copy embed).
wgpu.workspace = true
raw-window-handle = "0.6"
anyhow.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
libc.workspace = true
uuid.workspace = true
# GCD (libdispatch) — identical on iOS and macOS; same crate `gpui_macos` uses.
dispatch2 = "0.3.1"
